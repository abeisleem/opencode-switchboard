name: Sync npm releases

on:
  pull_request:
    paths:
      - package.json
      - scripts/sync-releases.mjs
      - test/release-sync.test.mjs
      - .github/workflows/sync-releases.yml
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - CHANGELOG.md
      - scripts/sync-releases.mjs
      - .github/workflows/sync-releases.yml
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to wait for; leave empty to reconcile published versions"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: npm-github-release-sync-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test test/release-sync.test.mjs
  sync:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Synchronize published versions and changelog notes
        run: node scripts/sync-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
